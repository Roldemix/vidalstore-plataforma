# Maquina `gw-azure`: unico punto publico. Caddy (red del host) termina TLS y
# reenvia /v1/* al borde de AWS; el frontend (imagen con Caddy en :80) solo
# escucha en loopback:8080. Config: /opt/vidalstore/secretos/gw-azure.env (fuera de Git).
name: vidalstore-gw-azure

services:
  frontend:
    image: ${REGISTRO:-ghcr.io/roldemix}/vidalstore-frontend:${FRONTEND_VERSION:?definir FRONTEND_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  borde:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:?definir en /opt/vidalstore/secretos/gw-azure.env}
      ACME_EMAIL: ${ACME_EMAIL:?definir en /opt/vidalstore/secretos/gw-azure.env}
      AWS_URL: ${AWS_URL:?definir en /opt/vidalstore/secretos/gw-azure.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config

volumes:
  caddy-datos:
  caddy-config:
