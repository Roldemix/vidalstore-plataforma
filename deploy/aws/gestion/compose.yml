# Maquina `gestion`: administracion. No publica puertos a Internet: solo se
# llega por Session Manager con un tunel a 127.0.0.1.
name: vidalstore-gestion

services:
  admin:
    image: ${REGISTRO:-ghcr.io/roldemix}/vidalstore-admin:${ADMIN_VERSION:-latest}
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-10.0.21.10:9092,10.0.22.10:9092,10.0.21.11:9092}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?definir en /opt/vidalstore/gestion/.env}
      COGNITO_CLIENT_IDS: ${COGNITO_CLIENT_IDS:?definir en /opt/vidalstore/gestion/.env}
      RABBIT_API_URL: ${RABBIT_API_URL:-http://10.0.21.10:15672}
      RABBIT_USER: ${RABBITMQ_DEFAULT_USER:?definir en /opt/vidalstore/gestion/.env}
      RABBIT_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?definir en /opt/vidalstore/gestion/.env}
      RABBIT_VHOST: /
      PORT: "3020"
    ports:
      # Solo loopback: el tunel de SSM es el unico camino.
      - "127.0.0.1:3020:3020"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3020,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: vidalstore
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BROKERS:-10.0.21.10:9092,10.0.22.10:9092,10.0.21.11:9092}
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      admin:
        condition: service_healthy
