# Maquina `gw-aws`: Caddy delante del gateway. 443 solo desde gw-azure (SG).
name: vidalstore-gw-aws

services:
  borde:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?definir en /opt/vidalstore/gw-aws/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  caddy-datos:
  caddy-config:
