services:
  rabbit1:
    image: rabbitmq:4-management
    container_name: vidalstore-rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_DEFAULT_USER: vidal
      RABBITMQ_DEFAULT_PASS: vidal_dev
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola de administración
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbit1-data:/var/lib/rabbitmq

volumes:
  rabbit1-data: