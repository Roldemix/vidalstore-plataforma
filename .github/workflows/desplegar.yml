name: Desplegar

# Se despliega al integrar a main un cambio en versiones o en deploy/, o a mano.
# Sin secretos en GitHub: solo Variables (BUCKET, FRONTEND_URL, AWS_URL).
# Secretos AWS: Parameter Store (SecureString). Secretos Azure: /opt/vidalstore/secretos.
on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/desplegar.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-main
  cancel-in-progress: false

jobs:
  validar:
    name: Validar
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.BUCKET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      AWS_URL: ${{ vars.AWS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Variables presentes
        run: |
          for v in BUCKET FRONTEND_URL AWS_URL; do
            [[ -n "${!v}" ]] || { echo "::error::Falta la Variable $v"; exit 1; }
          done

      - name: Sintaxis de scripts
        run: for f in deploy/aws/*.sh deploy/azure/*.sh; do bash -n "$f"; done

      - name: Versiones y descarga sin login
        run: |
          set -euo pipefail
          set -a; source deploy/versiones.env; set +a
          docker logout ghcr.io || true
          declare -A IMG=(
            [GATEWAY]=vidalstore-gateway [BFF]=vidalstore-bff
            [CATALOGO]=vidalstore-catalogo-service [LICENCIAS]=vidalstore-licencias-service
            [EVENTOS]=vidalstore-eventos [ADMIN]=vidalstore-admin [FRONTEND]=vidalstore-frontend )
          for k in "${!IMG[@]}"; do
            v="${k}_VERSION"; sha="${!v}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$v no es un SHA de 40 caracteres: $sha"; exit 1; }
            docker manifest inspect "$REGISTRO/${IMG[$k]}:$sha" >/dev/null \
              || { echo "::error::$REGISTRO/${IMG[$k]}:$sha no se descarga sin login (paquete privado o tag inexistente)"; exit 1; }
            echo "OK $REGISTRO/${IMG[$k]}:$sha"
          done

  aws:
    name: AWS (servicios, gestion y gw-aws)
    needs: validar
    # Runner en `gestion`; despliega con su rol IAM por Session Manager (sin SSH).
    runs-on: [self-hosted, linux, aws]
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_URL: ${{ vars.AWS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar por Session Manager
        run: |
          set -euo pipefail
          [[ "$AWS_URL" == https://* ]] || { echo "::error::AWS_URL vacia o invalida"; exit 1; }
          VERS="$(grep -E '^[A-Z0-9_]+=' deploy/versiones.env | base64 -w0)"
          DOMINIO="${AWS_URL#https://}"; DOMINIO="${DOMINIO%/}"

          enviar() { # $1 = nombre de la maquina, $2 = script local
            local id cmd st
            id="$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=vidalstore-$1" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)"
            [[ -n "$id" && "$id" != "None" ]] || { echo "::error::vidalstore-$1 no esta en ejecucion"; return 1; }
            cmd="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$id" \
              --comment "$1 $GITHUB_SHA" --timeout-seconds 900 \
              --parameters "{\"commands\":[\"echo $(base64 -w0 "$2") | base64 -d | bash\"]}" \
              --query Command.CommandId --output text)"
            for _ in $(seq 1 180); do
              st="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" --query Status --output text 2>/dev/null || echo Pending)"
              case "$st" in Success|Failed|TimedOut|Cancelled) break;; esac
              sleep 5
            done
            aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text || true
            [[ "$st" == "Success" ]] || { echo "::error::$1: $st"; return 1; }
          }

          # Servicios y gestion: el .env sale de Parameter Store con el rol de la instancia.
          for m in servicios gestion; do
            cat >"$RUNNER_TEMP/$m.sh" <<EOS
          set -euo pipefail
          export PATH=\$PATH:/usr/local/bin AWS_DEFAULT_REGION=us-east-1
          install -d -m 700 /opt/vidalstore/$m
          cd /opt/vidalstore/$m
          (umask 077; aws ssm get-parameter --name /vidalstore/$m.env --with-decryption \
            --query Parameter.Value --output text > .env)
          echo '$(base64 -w0 deploy/aws/$m/compose.yml)' | base64 -d > compose.yml
          echo '$VERS' | base64 -d > versiones.env
          docker compose --env-file .env --env-file versiones.env pull
          docker compose --env-file .env --env-file versiones.env up -d --remove-orphans
          EOS
            sed -i 's/^          //' "$RUNNER_TEMP/$m.sh"
            enviar "$m" "$RUNNER_TEMP/$m.sh"
          done

          # gw-aws: Caddy + dominio sslip.io. Solo viajan compose y Caddyfile.
          cat >"$RUNNER_TEMP/gw-aws.sh" <<EOS
          set -euo pipefail
          install -d /opt/vidalstore/gw-aws
          cd /opt/vidalstore/gw-aws
          echo 'DOMINIO=$DOMINIO' > .env
          echo '$(base64 -w0 deploy/aws/gw-aws/compose.yml)' | base64 -d > compose.yml
          echo '$(base64 -w0 deploy/aws/gw-aws/Caddyfile)' | base64 -d > Caddyfile
          docker compose pull
          docker compose up -d --force-recreate --remove-orphans
          EOS
          sed -i 's/^          //' "$RUNNER_TEMP/gw-aws.sh"
          enviar gw-aws "$RUNNER_TEMP/gw-aws.sh"

  azure:
    name: Azure (bff y gw-azure)
    needs: validar
    # Runner en `bff` (privada): despliega local y salta por SSH a gw-azure.
    runs-on: [self-hosted, linux, azure]
    steps:
      - uses: actions/checkout@v4

      - name: Leer versiones
        run: grep -E '^[A-Z0-9_]+=' deploy/versiones.env >> "$GITHUB_ENV"

      - name: BFF (local)
        run: |
          set -euo pipefail
          docker compose --env-file /opt/vidalstore/secretos/bff.env -f deploy/azure/bff/compose.yml pull
          docker compose --env-file /opt/vidalstore/secretos/bff.env -f deploy/azure/bff/compose.yml up -d --remove-orphans

      - name: gw-azure (SSH dentro de la VNet)
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/gw_azure_ed25519 -o StrictHostKeyChecking=accept-new azureuser@10.1.1.10"
          $SSH "cat > /opt/vidalstore/gw-azure/compose.yml" < deploy/azure/gw-azure/compose.yml
          $SSH "cat > /opt/vidalstore/gw-azure/Caddyfile" < deploy/azure/gw-azure/Caddyfile
          $SSH "cd /opt/vidalstore/gw-azure && export REGISTRO='$REGISTRO' FRONTEND_VERSION='$FRONTEND_VERSION' && docker compose --env-file /opt/vidalstore/secretos/gw-azure.env pull && docker compose --env-file /opt/vidalstore/secretos/gw-azure.env up -d --remove-orphans && docker compose --env-file /opt/vidalstore/secretos/gw-azure.env restart borde"

  humo:
    name: Humo
    needs: [aws, azure]
    # Desde bff: su salida a Internet es la IP publica de gw-azure, la unica que
    # el 443 de gw-aws acepta.
    runs-on: [self-hosted, linux, azure]
    env:
      AWS_URL: ${{ vars.AWS_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Comprobar sitio y cadena
        run: |
          set -uo pipefail
          sonda() { # reintenta hasta 5 min (emision del certificado)
            local n="$1"; shift; local code
            for _ in $(seq 1 "$n"); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$@" 2>/dev/null || true)"
              [[ "$code" =~ ^[234] ]] && { echo "OK $code  $*"; return 0; }
              sleep 10
            done
            echo "FALLA ($code)  $*"; return 1
          }
          H="${FRONTEND_URL#https://}"; H="${H%/}"
          # Directo a la IP privada de gw-azure (evita el hairpin desde bff); SNI y cert reales.
          sonda 30 --resolve "$H:443:10.1.1.10" "https://$H/" || exit 1

          CERT_AWS=real
          if ! sonda 6 "$AWS_URL/v1/"; then
            CERT_AWS=staging
            echo "::warning::El certificado de gw-aws no es de confianza (staging). Probando con -k."
            sonda 6 -k "$AWS_URL/v1/" || exit 1
          fi
          if ! sonda 6 --resolve "$H:443:10.1.1.10" "https://$H/v1/"; then
            [[ "$CERT_AWS" == staging ]] && echo "::warning::/v1 via gw-azure falla hasta activar el certificado real en gw-aws" \
              || exit 1
          fi
